<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --white:#fff; --black:#0a0a0a; --gray:#999; --border:#e0e0e0; --radius:14px; --shadow:0 2px 10px rgba(0,0,0,0.05); --green:#2e7d32; --blue:#1565c0; --orange:#e65100; --red:#c62828; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',-apple-system,sans-serif; background:#f5f5f5; color:var(--black); font-weight:400; max-width:480px; margin:0 auto; min-height:100vh; -webkit-tap-highlight-color:transparent; padding-bottom:80px; }
        h2 { font-weight:800; margin-bottom:14px; }
        .card { background:var(--white); padding:16px; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:10px; }
        .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--white); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:10px 0 14px; z-index:100; }
        .bottom-nav .nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; font-size:11px; font-weight:600; color:var(--gray); }
        .bottom-nav .nav-item.active { color:var(--black); }
        .bottom-nav .nav-item .nav-icon { font-size:22px; }
        .tab { display:none; padding:16px; }
        .tab.active { display:block; }
        .stat-row { display:flex; gap:8px; margin-bottom:14px; }
        .stat-box { flex:1; background:var(--white); padding:14px; border-radius:var(--radius); text-align:center; box-shadow:var(--shadow); }
        .stat-box .num { font-size:28px; font-weight:800; } .stat-box .lbl { font-size:10px; color:var(--gray); text-transform:uppercase; }
        .status-badge { padding:4px 8px; border-radius:6px; font-size:10px; font-weight:700; }
        .status-new { background:#e3f2fd; color:#1565c0; } .status-processing { background:#fff3e0; color:#e65100; } .status-printing { background:#fce4ec; color:#c62828; } .status-ready { background:#e8f5e9; color:#2e7d32; } .status-shipped { background:#e0f7fa; color:#00838f; } .status-done { background:#f3e5f5; color:#6a1b9a; }
        .btn { display:block; width:100%; padding:10px; border-radius:8px; font-weight:700; font-size:13px; border:none; cursor:pointer; font-family:inherit; text-align:center; margin-top:6px; }
        .btn-dark { background:var(--black); color:#fff; } .btn-outline { background:transparent; border:2px solid var(--black); color:var(--black); margin-top:10px; }
        .btn-sm { width:auto; display:inline-block; padding:6px 12px; font-size:11px; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:200; justify-content:center; align-items:center; }
        .modal.show { display:flex; } .modal-box { background:#fff; padding:20px; border-radius:14px; max-width:360px; margin:20px; width:100%; max-height:80vh; overflow-y:auto; }
        .form-group { margin-bottom:10px; }
        .form-group label { display:block; font-weight:600; font-size:11px; margin-bottom:3px; color:#555; text-transform:uppercase; }
        .form-group input, .form-group select { width:100%; padding:10px; border:2px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; }
        .client-card { background:var(--white); padding:14px; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:8px; cursor:pointer; }
        .workshop-card { background:var(--white); padding:14px; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:8px; }
        .fab { position:fixed; bottom:90px; right:calc(50% - 220px); width:48px; height:48px; border-radius:50%; background:var(--black); color:#fff; font-size:28px; border:none; cursor:pointer; z-index:50; display:flex; align-items:center; justify-content:center; }
        .chat-mini { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); height:250px; display:flex; flex-direction:column; overflow:hidden; margin-top:8px; }
        .chat-mini .chat-msgs { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:4px; }
        .chat-mini .chat-msg { max-width:80%; padding:5px 8px; border-radius:10px; font-size:11px; }
        .chat-mini .chat-msg.client { align-self:flex-end; background:var(--black); color:#fff; }
        .chat-mini .chat-msg.admin { align-self:flex-start; background:#eee; }
        .chat-mini .chat-input-row { display:flex; gap:4px; padding:6px; border-top:1px solid var(--border); }
        .chat-mini .chat-input-row input { flex:1; padding:6px; border:1px solid var(--border); border-radius:12px; font-family:inherit; font-size:12px; }
        .chat-mini .chat-input-row button { padding:6px 10px; border-radius:12px; background:var(--black); color:#fff; border:none; font-weight:600; cursor:pointer; font-size:11px; }
    </style>
</head>
<body>

<div id="loginBlock" style="padding:16px;">
    <h2>🔒 Админ</h2>
    <div class="card">
        <input type="password" id="adminPass" placeholder="Пароль" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:10px;">
        <button class="btn btn-dark" onclick="login()">Войти</button>
    </div>
</div>

<div id="appBlock" style="display:none;">
    <div class="tab active" id="tab-dash"></div>
    <div class="tab" id="tab-orders"></div>
    <div class="tab" id="tab-clients"></div>
    <div class="tab" id="tab-workshops"></div>

    <nav class="bottom-nav">
        <div class="nav-item active" data-tab="tab-dash"><span class="nav-icon">📊</span>Главная</div>
        <div class="nav-item" data-tab="tab-orders"><span class="nav-icon">📋</span>Заказы</div>
        <div class="nav-item" data-tab="tab-clients"><span class="nav-icon">👥</span>Клиенты</div>
        <div class="nav-item" data-tab="tab-workshops"><span class="nav-icon">🏭</span>Типографии</div>
    </nav>
</div>

<div class="modal" id="modal"><div class="modal-box" id="modalContent"></div></div>

<script>
    const API = '/api';
    const PASS = 'kprint2024';
    let allOrders = [], allUsers = [], allChats = [];
    let workshops = JSON.parse(localStorage.getItem('workshops') || JSON.stringify([{ id:'admiral', name:'Типография Адмирал', email:'aprint23@mail.ru', phone:'+79286609776', address:'ул. Стасова, 178/1' }]));
    const statusNames = { 'new':'Новый','processing':'В обработке','printing':'В печати','ready':'Готов','shipped':'Отправлен','done':'Доставлен' };

    function switchTab(id) { document.querySelectorAll('#appBlock .tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
        document.querySelector(`[data-tab="${id}"]`).classList.add('active'); if (id === 'tab-dash') loadDashboard(); if (id === 'tab-orders') loadOrdersTab(); if (id === 'tab-clients') loadClientsTab(); if (id === 'tab-workshops') loadWorkshopsTab(); }
    document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.addEventListener('click', () => switchTab(i.dataset.tab)));

    function login() { if (document.getElementById('adminPass').value === PASS) { document.getElementById('loginBlock').style.display = 'none';
            document.getElementById('appBlock').style.display = 'block';
            refreshAll();
            switchTab('tab-dash'); } else alert('Неверный пароль'); }

    async function refreshAll() { try { const o = await fetch(API + '/admin/orders');
            allOrders = await o.json(); const u = await fetch(API + '/users');
            allUsers = await u.json(); } catch (e) {} }

    function loadDashboard() { const n = allOrders.filter(o => o.status === 'new').length, p = allOrders.filter(o => ['processing','printing'].includes(o.status)).length, r = allOrders.filter(o => ['ready','shipped','done'].includes(o.status)).length;
        document.getElementById('tab-dash').innerHTML = `<h2>📊 Панель</h2><div class="stat-row"><div class="stat-box"><div class="num">${n}</div><div class="lbl">Новых</div></div><div class="stat-box"><div class="num">${p}</div><div class="lbl">В работе</div></div><div class="stat-box"><div class="num">${r}</div><div class="lbl">Готовых</div></div></div><div class="stat-row"><div class="stat-box"><div class="num">${allUsers.length}</div><div class="lbl">Клиентов</div></div><div class="stat-box"><div class="num">${workshops.length}</div><div class="lbl">Типографий</div></div></div>`; }

    function loadOrdersTab() { document.getElementById('tab-orders').innerHTML = `<h2>📋 Заказы</h2><select onchange="renderOrders(this.value)" style="width:100%;padding:8px;border-radius:8px;margin-bottom:10px;font-family:inherit;"><option value="all">Все</option><option value="new">Новые</option><option value="progress">В работе</option><option value="ready">Готовые</option></select><div id="ordersList"></div>`; renderOrders('all'); }

    function renderOrders(filter) { const f = filter === 'all' ? allOrders : filter === 'progress' ? allOrders.filter(o => ['processing','printing'].includes(o.status)) : allOrders.filter(o => o.status === filter || (filter === 'ready' && ['ready','shipped','done'].includes(o.status)));
        document.getElementById('ordersList').innerHTML = f.length === 0 ? '<p style="color:var(--gray);text-align:center;">Нет заказов</p>' : f.map(o => `<div class="card"><strong>#${o.id}</strong> — ${o.material}<br>${o.width}×${o.height} мм × ${o.qty} шт — ${o.total} р.<br><span class="status-badge status-${o.status}">${statusNames[o.status]}</span> ${o.workshop?`🏭 ${o.workshop}`:''}<br>👤 ${o.name} | 📞 ${o.phone}<br>${o.fileUrl?`📎 <a href="${o.fileUrl}" target="_blank">Скачать макет</a>`:''}${o.status==='new'?`<button class="btn btn-dark btn-sm" onclick="sendToWorkshop('${o.id}')">🏭 В цех</button>`:''}<select onchange="updateStatus('${o.id}',this.value)" style="width:100%;padding:4px;margin-top:4px;border-radius:4px;">${Object.keys(statusNames).map(s => `<option value="${s}" ${o.status===s?'selected':''}>${statusNames[s]}</option>`).join('')}</select></div>`).join(''); }

    async function updateStatus(id, status) { await fetch(API + '/admin/status', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ orderId:id, status }) }); refreshAll();
        loadOrdersTab(); }

    function sendToWorkshop(orderId) { const order = allOrders.find(o => o.id === orderId); if (!order) return;
        document.getElementById('modalContent').innerHTML = `<h3>🏭 Выберите цех</h3>${workshops.map(w => `<div class="workshop-card" onclick="confirmSend('${orderId}','${w.id}')"><strong>${w.name}</strong><br><span style="font-size:11px;color:var(--gray);">📧 ${w.email} | 📞 ${w.phone}</span></div>`).join('')}<button class="btn btn-outline" onclick="closeModal()">Отмена</button>`;
        document.getElementById('modal').classList.add('show'); }

    async function confirmSend(orderId, wsId) { const ws = workshops.find(w => w.id === wsId), order = allOrders.find(o => o.id === orderId); if (!ws || !order) return;
        await updateStatus(orderId, 'processing');
        order.workshop = ws.name;
        const body = `Материал: ${order.material}\nТип печати: ${order.material}\nРазмер: ${order.width}×${order.height} мм\nКол-во: ${order.qty} шт`;
        closeModal();
        refreshAll();
        loadOrdersTab(); }

    function loadClientsTab() { document.getElementById('tab-clients').innerHTML = `<h2>👥 Клиенты</h2><div id="clientsList"></div>`; renderClients(); }

    function renderClients() { document.getElementById('clientsList').innerHTML = allUsers.length === 0 ? '<p style="color:var(--gray);">Нет клиентов</p>' : allUsers.map(u => `<div class="client-card" onclick="openClientChat('${u.id}','${u.name||u.email}')"><strong>${u.name||'Без имени'}</strong><br><span style="font-size:12px;color:var(--gray);">📧 ${u.email} | 📞 ${u.phone||'—'}</span><br><span style="font-size:11px;">Заказов: ${allOrders.filter(o => o.userId === u.id).length}</span></div>`).join(''); }

    async function openClientChat(userId, name) {
        const res = await fetch(API + '/chat/' + userId);
        const msgs = await res.json();
        document.getElementById('modalContent').innerHTML = `<h3>💬 ${name}</h3><div class="chat-mini"><div class="chat-msgs">${msgs.map(m => `<div class="chat-msg ${m.from==='admin'?'admin':'client'}">${m.text}</div>`).join('')}</div><div class="chat-input-row"><input type="text" id="clientChatInput" placeholder="Ответить..."><button onclick="sendClientChat('${userId}')">➤</button></div></div><button class="btn btn-outline" onclick="closeModal()" style="margin-top:8px;">Закрыть</button>`;
        document.getElementById('modal').classList.add('show');
    }

    async function sendClientChat(userId) { const text = document.getElementById('clientChatInput').value.trim(); if (!text) return;
        await fetch(API + '/chat', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ from:'admin', text, userId }) });
        const user = allUsers.find(u => u.id === userId);
        openClientChat(userId, user?.name || 'Клиент'); }

    function loadWorkshopsTab() { document.getElementById('tab-workshops').innerHTML = `<h2>🏭 Типографии</h2><div id="workshopsList"></div>`; renderWorkshops(); }
    function renderWorkshops() { document.getElementById('workshopsList').innerHTML = workshops.map((w,i) => `<div class="workshop-card"><strong>${w.name}</strong><br><span style="font-size:11px;color:var(--gray);">📧 ${w.email} | 📞 ${w.phone}</span><br><span style="font-size:11px;color:var(--gray);">📍 ${w.address}</span><br><button class="btn btn-outline btn-sm" onclick="editWorkshop(${i})">✏️</button> <button class="btn btn-outline btn-sm" onclick="deleteWorkshop(${i})" style="color:var(--red);border-color:var(--red);">🗑</button></div>`).join('') + '<button class="fab" onclick="addWorkshop()">+</button>'; }
    function addWorkshop() { document.getElementById('modalContent').innerHTML = `<h3>Новая типография</h3><div class="form-group"><label>Название</label><input type="text" id="wsName"></div><div class="form-group"><label>Email</label><input type="email" id="wsEmail"></div><div class="form-group"><label>Телефон</label><input type="tel" id="wsPhone"></div><div class="form-group"><label>Адрес</label><input type="text" id="wsAddr"></div><button class="btn btn-dark" onclick="saveWorkshop()">Сохранить</button><button class="btn btn-outline" onclick="closeModal()">Отмена</button>`;
        document.getElementById('modal').classList.add('show'); }
    function saveWorkshop() { const w = { id:'ws-'+Date.now(), name:document.getElementById('wsName').value, email:document.getElementById('wsEmail').value, phone:document.getElementById('wsPhone').value, address:document.getElementById('wsAddr').value }; if (!w.name) return;
        workshops.push(w);
        localStorage.setItem('workshops', JSON.stringify(workshops));
        closeModal();
        loadWorkshopsTab(); }
    function editWorkshop(i) { const w = workshops[i];
        document.getElementById('modalContent').innerHTML = `<h3>Редактировать</h3><div class="form-group"><label>Название</label><input type="text" id="wsName" value="${w.name}"></div><div class="form-group"><label>Email</label><input type="email" id="wsEmail" value="${w.email}"></div><div class="form-group"><label>Телефон</label><input type="tel" id="wsPhone" value="${w.phone}"></div><div class="form-group"><label>Адрес</label><input type="text" id="wsAddr" value="${w.address}"></div><button class="btn btn-dark" onclick="updateWorkshop(${i})">Сохранить</button><button class="btn btn-outline" onclick="closeModal()">Отмена</button>`;
        document.getElementById('modal').classList.add('show'); }
    function updateWorkshop(i) { workshops[i] = { ...workshops[i], name:document.getElementById('wsName').value, email:document.getElementById('wsEmail').value, phone:document.getElementById('wsPhone').value, address:document.getElementById('wsAddr').value };
        localStorage.setItem('workshops', JSON.stringify(workshops));
        closeModal();
        loadWorkshopsTab(); }
    function deleteWorkshop(i) { if (confirm('Удалить?')) { workshops.splice(i, 1);
            localStorage.setItem('workshops', JSON.stringify(workshops));
            loadWorkshopsTab(); } }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    setInterval(refreshAll, 20000);
    refreshAll();
    document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
