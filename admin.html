<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --white:#fff; --black:#0a0a0a; --gray:#999; --border:#e0e0e0; --radius:14px; --shadow:0 2px 10px rgba(0,0,0,0.05); --green:#2e7d32; --blue:#1565c0; --orange:#e65100; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',-apple-system,sans-serif; background:#f5f5f5; color:var(--black); font-weight:400; max-width:480px; margin:0 auto; min-height:100vh; -webkit-tap-highlight-color:transparent; padding:16px; }
        h2 { font-weight:800; margin-bottom:14px; }
        .card { background:var(--white); padding:16px; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:10px; }
        .order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
        .order-id { font-weight:800; font-size:14px; }
        .order-status { padding:5px 10px; border-radius:20px; font-size:11px; font-weight:700; }
        .status-new { background:#e3f2fd; color:#1565c0; } .status-processing { background:#fff3e0; color:#e65100; }
        .status-printing { background:#fce4ec; color:#c62828; } .status-ready { background:#e8f5e9; color:#2e7d32; }
        .status-shipped { background:#e0f7fa; color:#00838f; } .status-done { background:#f3e5f5; color:#6a1b9a; }
        .order-body { font-size:13px; color:#555; margin-bottom:6px; } .order-body span { display:block; margin-bottom:1px; }
        .order-client { font-size:11px; color:var(--gray); border-top:1px solid #eee; padding-top:6px; }
        .order-workshop { display:inline-block; background:#f5f5f5; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600; margin-top:6px; }
        .btn { display:block; width:100%; padding:10px; border-radius:8px; font-weight:700; font-size:13px; border:none; cursor:pointer; font-family:inherit; text-align:center; margin-top:6px; }
        .btn-dark { background:var(--black); color:#fff; } .btn-outline { background:transparent; border:2px solid var(--black); color:var(--black); margin-top:10px; }
        .filter-row { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
        .filter-btn { padding:7px 14px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid var(--border); background:#fff; cursor:pointer; font-family:inherit; }
        .filter-btn.active { background:var(--black); color:#fff; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:200; justify-content:center; align-items:center; }
        .modal.show { display:flex; } .modal-box { background:#fff; padding:20px; border-radius:14px; max-width:360px; margin:20px; }
        .workshop-item { padding:12px; border:2px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; }
        .workshop-item:hover { border-color:var(--black); } .workshop-item .wname { font-weight:700; } .workshop-item .winfo { font-size:11px; color:var(--gray); }
        .chat-mini { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); height:250px; display:flex; flex-direction:column; overflow:hidden; margin-top:10px; }
        .chat-mini .chat-msgs { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:4px; }
        .chat-mini .chat-msg { max-width:80%; padding:6px 10px; border-radius:12px; font-size:12px; }
        .chat-mini .chat-msg.client { align-self:flex-end; background:var(--black); color:#fff; }
        .chat-mini .chat-msg.admin { align-self:flex-start; background:#eee; }
        .chat-mini .chat-input-row { display:flex; gap:6px; padding:8px; border-top:1px solid var(--border); }
        .chat-mini .chat-input-row input { flex:1; padding:8px; border:1px solid var(--border); border-radius:16px; font-family:inherit; }
        .chat-mini .chat-input-row button { padding:8px 14px; border-radius:16px; background:var(--black); color:#fff; border:none; font-weight:600; cursor:pointer; }
    </style>
</head>
<body>
<div id="loginBlock">
    <h2>🔒 Админ</h2>
    <div class="card">
        <input type="password" id="adminPass" placeholder="Пароль" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:10px;">
        <button class="btn btn-dark" onclick="login()">Войти</button>
    </div>
</div>

<div id="adminBlock" style="display:none;">
    <h2>📋 Заказы</h2>
    <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('new')">🆕 Новые</button>
        <button class="filter-btn" onclick="setFilter('progress')">⚙️ В работе</button>
        <button class="filter-btn" onclick="setFilter('ready')">✅ Готовы</button>
        <button class="filter-btn" onclick="setFilter('all')">📋 Все</button>
    </div>
    <div id="ordersList"></div>
    <button class="btn btn-outline" onclick="showChat()">💬 Чат с клиентами</button>
    <div id="chatBlock"></div>
    <button class="btn btn-outline" onclick="logout()">Выйти</button>
</div>

<div class="modal" id="workshopModal">
    <div class="modal-box"><h3>🏭 Выберите цех</h3><div id="workshopList"></div><button class="btn btn-outline" onclick="closeWorkshop()">Отмена</button></div>
</div>

<script>
    const API = '/api';
    const PASS = 'kprint2024';
    let currentFilter = 'new';
    let allOrders = [];
    const workshops = [{ id:'admiral', name:'Типография Адмирал', email:'aprint23@mail.ru', phone:'+79286609776', address:'ул. Стасова, 178/1' }];

    const statusNames = { 'new':'Новый','processing':'В обработке','printing':'В печати','ready':'Готов','shipped':'Отправлен','done':'Доставлен' };
    const statusClasses = { 'new':'status-new','processing':'status-processing','printing':'status-printing','ready':'status-ready','shipped':'status-shipped','done':'status-done' };

    function login() { if (document.getElementById('adminPass').value === PASS) { document.getElementById('loginBlock').style.display='none';
            document.getElementById('adminBlock').style.display='block';
            loadOrders(); } else alert('Неверный пароль'); }

    function logout() { document.getElementById('loginBlock').style.display='block';
        document.getElementById('adminBlock').style.display='none'; }

    async function loadOrders() { try { const res = await fetch(API + '/admin/orders');
            allOrders = await res.json();
            renderOrders(); } catch (e) {} }

    function setFilter(f) { currentFilter = f;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderOrders(); }

    function filterOrders() { if (currentFilter === 'new') return allOrders.filter(o => o.status === 'new'); if (currentFilter === 'progress') return allOrders.filter(o => ['processing','printing'].includes(o.status)); if (currentFilter === 'ready') return allOrders.filter(o => ['ready','shipped','done'].includes(o.status)); return allOrders; }

    function renderOrders() { const filtered = filterOrders();
        document.getElementById('ordersList').innerHTML = filtered.length === 0 ? '<div class="card" style="text-align:center;color:var(--gray);">Нет заказов</div>' : filtered.map(o => `
            <div class="card">
                <div class="order-header"><span class="order-id">#${o.id}</span><span class="order-status ${statusClasses[o.status]}">${statusNames[o.status]}</span></div>
                <div class="order-body"><span>${o.material}</span><span>${o.width}×${o.height} мм × ${o.qty} шт</span><span style="font-weight:700;">${o.total} р.</span>${o.fileUrl?`<span>📎 <a href="${o.fileUrl}" target="_blank">Скачать макет</a></span>`:''}</div>
                ${o.workshop?`<div class="order-workshop">🏭 ${o.workshop}</div>`:''}
                <div class="order-client">👤 ${o.name} | 📞 ${o.phone} | 📧 ${o.email||'—'}<br>📍 ${o.addr||'—'}<br>📅 ${new Date(o.createdAt).toLocaleDateString()}</div>
                ${o.status==='new'?`<button class="btn btn-dark" onclick="openWorkshop('${o.id}')">🏭 Отправить в цех</button>`:''}
                <select style="width:100%;padding:6px;border-radius:6px;margin-top:6px;font-family:inherit;" onchange="changeStatus('${o.id}',this.value)">
                    ${Object.keys(statusNames).map(s => `<option value="${s}" ${o.status===s?'selected':''}>${statusNames[s]}</option>`).join('')}
                </select>
            </div>`).join(''); }

    async function changeStatus(id, newStatus) { await fetch(API + '/admin/status', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ orderId:id, status:newStatus }) });
        loadOrders(); }

    function openWorkshop(orderId) { document.getElementById('workshopList').innerHTML = workshops.map(w => `<div class="workshop-item" onclick="sendToWorkshop('${orderId}','${w.id}')"><div class="wname">${w.name}</div><div class="winfo">📧 ${w.email} | 📞 ${w.phone}</div><div class="winfo">📍 ${w.address}</div></div>`).join('');
        document.getElementById('workshopModal').classList.add('show'); }

    function closeWorkshop() { document.getElementById('workshopModal').classList.remove('show'); }

    async function sendToWorkshop(orderId, wsId) { const ws = workshops.find(w => w.id === wsId);
        await changeStatus(orderId, 'processing'); const order = allOrders.find(o => o.id === orderId); if (order && ws) { order.workshop = ws.name; const subject = encodeURIComponent(`НОВЫЙ ЗАКАЗ #${orderId}`);
            const body = encodeURIComponent(`Материал: ${order.material}\nРазмер: ${order.width}×${order.height} мм\nКол-во: ${order.qty} шт\nИтого: ${order.total} р.\nКлиент: ${order.name}\nТел: ${order.phone}\nАдрес: ${order.addr||'—'}\nМакет: ${order.fileUrl||'нет'}`); window.open(`mailto:${ws.email}?subject=${subject}&body=${body}`); }
        closeWorkshop();
        loadOrders(); }

    async function showChat() { const res = await fetch(API + '/chat');
        const msgs = await res.json();
        document.getElementById('chatBlock').innerHTML = `<div class="chat-mini"><div class="chat-msgs" id="adminChatMsgs">${msgs.map(m => `<div class="chat-msg ${m.from==='admin'?'admin':'client'}">${m.text}</div>`).join('')}</div><div class="chat-input-row"><input type="text" id="adminChatInput" placeholder="Ответить..."><button onclick="sendAdminChat()">➤</button></div></div>`; }

    async function sendAdminChat() { const text = document.getElementById('adminChatInput').value.trim(); if (!text) return;
        await fetch(API + '/chat', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ from:'admin', text }) });
        showChat(); }

    // Пуш-уведомления
    async function requestPush() { if ('Notification' in window && Notification.permission === 'default') { await Notification.requestPermission(); } }

    function notify(title, body) { if ('Notification' in window && Notification.permission === 'granted') { new Notification(title, { body, icon:'🔔' }); } }

    // Автообновление
    setInterval(() => { if (document.getElementById('adminBlock').style.display === 'block') { const prev = allOrders.length;
            loadOrders(); if (allOrders.length > prev) notify('Новый заказ!', 'Поступил новый заказ'); } }, 15000);

    document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    requestPush();
</script>
</body>
</html>
