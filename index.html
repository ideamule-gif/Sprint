<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заказ печати</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <style>
        :root { --white: #fff; --black: #0a0a0a; --gray: #999; --border: #e0e0e0; --radius: 14px; --shadow: 0 2px 10px rgba(0,0,0,0.05); --red: #d32f2f; --green: #2e7d32; --accent: #0a0a0a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #f5f5f5; color: var(--black); font-weight: 400; max-width: 480px; margin: 0 auto; min-height: 100vh; -webkit-tap-highlight-color: transparent; padding-bottom: 80px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glow { 0%, 100% { text-shadow: 0 0 20px rgba(255,255,255,0.3); } 50% { text-shadow: 0 0 30px rgba(255,255,255,0.5); } }
        @keyframes wave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(15deg); } 75% { transform: rotate(-15deg); } }
        .anim-fade { animation: fadeInUp 0.6s ease forwards; }
        .anim-delay1 { animation-delay: 0.1s; opacity: 0; } .anim-delay2 { animation-delay: 0.25s; opacity: 0; } .anim-delay3 { animation-delay: 0.4s; opacity: 0; } .anim-delay4 { animation-delay: 0.55s; opacity: 0; }
        .wave { display: inline-block; animation: wave 0.6s ease-in-out 3; transform-origin: 70% 70%; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--white); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 14px; z-index: 100; }
        .bottom-nav .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--gray); position: relative; transition: 0.2s; }
        .bottom-nav .nav-item.active { color: var(--accent); }
        .bottom-nav .nav-item .nav-icon { font-size: 22px; }
        .tab { display: none; padding: 16px; }
        .tab.active { display: block; }
        .card { background: var(--white); padding: 16px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; }
        .tile-row { display: flex; flex-direction: column; gap: 12px; }
        .tile { background: var(--white); padding: 22px 18px; border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer; text-align: center; border: 2px solid var(--border); }
        .tile:active { border-color: var(--black); } .tile .tile-icon { font-size: 40px; } .tile .tile-title { font-weight: 800; font-size: 18px; } .tile .tile-sub { font-size: 12px; color: var(--gray); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; color: #555; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 16px; font-family: inherit; background: var(--white); }
        .form-group input.error { border-color: var(--red); }
        .row { display: flex; gap: 10px; } .row>div { flex: 1; }
        .hint { font-size: 11px; color: var(--gray); margin-top: 3px; } .hint-red { font-size: 11px; color: var(--red); margin-top: 3px; display: none; }
        .price-big { font-size: 32px; font-weight: 800; color: var(--black); text-align: center; }
        .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 16px; border: none; cursor: pointer; font-family: inherit; text-align: center; }
        .btn-primary { background: var(--black); color: #fff; } .btn-outline { background: transparent; border: 2px solid var(--black); color: var(--black); margin-top: 8px; }
        .upload-zone { border: 2px dashed #ccc; border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; font-size: 14px; color: var(--gray); }
        .upload-zone.has-file { border-color: var(--green); border-style: solid; color: var(--green); font-weight: 600; }
        .summary-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; }
        .summary-row.total { font-weight: 800; font-size: 18px; border-top: 1px solid #eee; margin-top: 4px; padding-top: 8px; }
        .footer-links { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .footer-links a { font-size: 11px; color: var(--gray); text-decoration: underline; }
        .back-btn { background: none; border: none; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--gray); padding: 4px 0; margin-bottom: 12px; }
        .chat-box { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); height: calc(100vh - 200px); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 13px; }
        .chat-msg.client { align-self: flex-end; background: var(--black); color: #fff; }
        .chat-msg.admin { align-self: flex-start; background: #eee; }
        .chat-input-row { display: flex; gap: 8px; padding: 8px; border-top: 1px solid var(--border); }
        .chat-input-row input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 20px; font-family: inherit; }
        .chat-input-row button { padding: 10px 16px; border-radius: 20px; background: var(--black); color: #fff; border: none; font-weight: 600; cursor: pointer; }
        .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
        .status-new { background: #e3f2fd; color: #1565c0; } .status-processing { background: #fff3e0; color: #e65100; }
        .status-ready { background: #e8f5e9; color: #2e7d32; } .status-done { background: #f3e5f5; color: #6a1b9a; }
        .scroll-down-btn { position:absolute; bottom:60px; right:12px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,0.15); color:#555; border:none; cursor:pointer; display:none; align-items:center; justify-content:center; font-size:14px; z-index:10; backdrop-filter:blur(4px); }
    </style>
</head>
<body>

<nav class="bottom-nav">
    <div class="nav-item active" data-tab="tab-home"><span class="nav-icon">🏠</span>Главная</div>
    <div class="nav-item" data-tab="tab-order"><span class="nav-icon">📐</span>Заказ</div>
    <div class="nav-item" data-tab="tab-chat"><span class="nav-icon">💬</span>Чат</div>
    <div class="nav-item" data-tab="tab-profile"><span class="nav-icon">👤</span>Профиль</div>
</nav>

<div class="tab active" id="tab-home">
    <div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:24px;">
        <div style="font-size:40px;font-weight:800;animation:glow 3s ease-in-out infinite;">Привет <span class="wave">👋</span></div>
        <div style="font-size:15px;color:var(--gray);font-weight:300;max-width:300px;">Это сервис для заказа баннеров. Закажи в пару кликов — а мы напечатаем и доставим.</div>
        <button class="btn btn-primary" style="width:auto;padding:16px 36px;border-radius:50px;" onclick="switchTab('tab-order')">Заказать</button>
    </div>
    <div class="footer-links">
    <a href="#" onclick="openModal('policy')">Политика</a>
    <a href="#" onclick="openModal('terms')">Соглашение</a>
    <a href="#" onclick="openModal('design')">Требования к макетам</a>
       
    </div>
</div>

<div class="tab" id="tab-order"><div id="orderStep"></div></div>
<div class="tab" id="tab-chat"><h2 style="font-weight:800;margin-bottom:14px;">💬 Чат с поддержкой</h2><div id="chatPage"></div></div>
<div class="tab" id="tab-profile"><h2 style="font-weight:800;margin-bottom:14px;">👤 Профиль</h2><div id="profileContent"></div></div>

<script>
    const API = '/api';
    let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    let matData = {};
    let uploadedFile = null;
    let orderStep = 1;
    const savedTab = sessionStorage.getItem('activeTab') || 'tab-home';

    // ========== PUSH-уведомления ==========
    const VAPID_PUBLIC = 'BO4rOIC4gMmMlgze-laJFcHh71oauLdhZji_Knqag6Z2MIosXOdueOofIbvlnH-EHIdr170jTLrFWhAOL-NcVds';
    let unreadCount = 0;

    async function subscribePush() {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
            sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC) });
        }
        if (currentUser?.id) {
            await fetch(API + '/push-subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, subscription: sub }) });
        }
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
        return outputArray;
    }

    async function updateChatBadge() {
        if (!currentUser?.id) return;
        try {
            const res = await fetch(API + '/chat/' + currentUser.id);
            const msgs = await res.json();
            const adminMsgs = msgs.filter(m => m.from === 'admin').length;
            const badge = document.querySelector('[data-tab="tab-chat"] .badge');
            if (adminMsgs > 0) {
                if (!badge) {
                    const el = document.querySelector('[data-tab="tab-chat"]');
                    const span = document.createElement('span');
                    span.className = 'badge';
                    span.style.cssText = 'background:var(--red);color:#fff;border-radius:10px;padding:2px 6px;font-size:9px;position:absolute;top:0;right:2px;';
                    span.textContent = adminMsgs;
                    el.style.position = 'relative';
                    el.appendChild(span);
                } else { badge.textContent = adminMsgs; }
            } else if (badge) { badge.remove(); }
        } catch (e) {}
    }

    setInterval(updateChatBadge, 5000);

    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
        sessionStorage.setItem('activeTab', tabId);
        if (tabId === 'tab-order') renderOrderStep();
        if (tabId === 'tab-chat') { loadChatPage(); unreadCount = 0; updateChatBadge(); }
        if (tabId === 'tab-profile') loadProfile();
    }
    document.querySelectorAll('.bottom-nav .nav-item').forEach(item => { item.addEventListener('click', () => switchTab(item.dataset.tab)); });
    switchTab(savedTab);

    let currentMaterial = 'banner';
    const basePrices = { 'banner-500': 500, 'banner-700': 700, 'banner-820': 820, 'selfad-840': 840, 'poster-500': 500, 'poster-800': 800 };

    function renderOrderStep() {
        const container = document.getElementById('orderStep');
        clearInterval(window._chatInterval);
        if (orderStep === 1) {
            container.innerHTML = `<h2 style="font-weight:800;margin-bottom:14px;">Выберите материал</h2><div class="tile-row"><div class="tile" onclick="selectMaterial('banner')"><div class="tile-icon">🪧</div><div class="tile-title">Баннер</div><div class="tile-sub">300г / 440г / 510г</div></div><div class="tile" onclick="selectMaterial('selfad')"><div class="tile-icon">🏷️</div><div class="tile-title">Самоклейка</div><div class="tile-sub">Матовая / глянцевая</div></div><div class="tile" onclick="selectMaterial('poster')"><div class="tile-icon">🖼️</div><div class="tile-title">Плакат</div><div class="tile-sub">Blueback / белая бумага</div></div></div>`;
        } else if (orderStep === 2) {
            container.innerHTML = `<button class="back-btn" onclick="orderStep=1;renderOrderStep();">← Назад</button><h2 style="font-weight:800;margin-bottom:14px;">${{banner:'🪧 Баннер',selfad:'🏷️ Самоклейка',poster:'🖼️ Плакат'}[currentMaterial]}</h2><div class="card"><div class="row"><div class="form-group"><label>Ширина, мм</label><input type="number" id="mWidth" value="1000" oninput="calc()"></div><div class="form-group"><label>Высота, мм</label><input type="number" id="mHeight" value="1000" oninput="calc()"></div></div><div class="hint-red" id="widthHint"></div><div class="form-group"><label>Количество, шт</label><input type="number" id="mQty" value="1" min="1" oninput="calc()"></div><div id="matOpts"></div></div><div style="text-align:center;margin:14px 0;"><div class="price-big" id="mTotal">1000 р.</div></div><button class="btn btn-primary" onclick="orderStep=3;renderOrderStep();">📋 Далее</button>`;
            document.getElementById('matOpts').innerHTML = currentMaterial === 'banner' ? `<div class="form-group"><label>Плотность</label><select id="bDens" onchange="calc()"><option value="500">300 г/м² — тонкий</option><option value="700" selected>440 г/м² — стандарт</option><option value="820">510 г/м² — премиум</option></select></div><label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px;"><input type="checkbox" id="bProkl" onchange="calc()"> Проклейка (+60 р/м.п.)</label><label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px;"><input type="checkbox" id="bLyuv" onchange="calc()"> Люверсы (+20 р/шт)</label>` : currentMaterial === 'selfad' ? `<div class="form-group"><label>Тип</label><select id="sType" onchange="calc()"><option value="840">Матовая</option><option value="840">Глянцевая</option></select></div><label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px;"><input type="checkbox" id="sRezka" onchange="calc()"> Обрезка (+25 р/м.п.)</label><div class="hint">Без обрезки — с белыми полями.</div>` : `<div class="form-group"><label>Бумага</label><select id="pType" onchange="calc()"><option value="500">Blueback (эконом)</option><option value="800">Белая (стандарт)</option></select></div><div class="hint">Blueback — синяя оборотка.</div>`;
            calc();
        } else {
            container.innerHTML = `<button class="back-btn" onclick="orderStep=2;renderOrderStep();">← Назад</button><h2 style="font-weight:800;margin-bottom:14px;">📋 Оформление</h2><div class="card" id="orderSummary">${buildSummary()}</div><div class="card"><h3>📎 Макет</h3><div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()"><span id="uploadText">Нажмите, чтобы загрузить файл</span></div><input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.cdr,.ai,.eps" style="display:none;" onchange="handleFile(event)"></div><div class="card"><h3>👤 Данные</h3><div class="form-group"><label>Имя</label><input type="text" id="custName" value="${currentUser?.name||''}"></div><div class="form-group"><label>Телефон</label><input type="tel" id="custPhone" value="${currentUser?.phone||''}"></div><div class="form-group"><label>Email</label><input type="email" id="custEmail" value="${currentUser?.email||''}"></div><div class="form-group"><label>Адрес</label><textarea id="custAddr" rows="2">${currentUser?.addr||''}</textarea></div><div class="hint">Сроки: 1-2 рабочих дня.</div></div><button class="btn btn-primary" onclick="submitOrder()">✅ Заказать</button>`;
        }
    }

    function selectMaterial(type) { currentMaterial = type; orderStep = 2; renderOrderStep(); }
    function getBasePrice() { if (currentMaterial === 'banner') return basePrices['banner-' + (document.getElementById('bDens')?.value || '700')]; if (currentMaterial === 'selfad') return 840; return basePrices['poster-' + (document.getElementById('pType')?.value || '500')]; }

    function calc() {
        const w = parseFloat(document.getElementById('mWidth').value) || 1000, h = parseFloat(document.getElementById('mHeight').value) || 1000, qty = parseInt(document.getElementById('mQty').value) || 1, area = (w / 1000) * (h / 1000), totalArea = area * qty;
        let maxW = currentMaterial === 'banner' ? 3200 : 1500;
        const hint = document.getElementById('widthHint'); if (w > maxW) { document.getElementById('mWidth').classList.add('error'); hint.style.display = 'block'; hint.innerText = `⚠️ Макс. ширина — ${maxW} мм`; } else { document.getElementById('mWidth').classList.remove('error'); hint.style.display = 'none'; }
        let base = getBasePrice(), ppm = totalArea >= 5 ? base : Math.round(base * 1.3), perim = ((w + h) * 2) / 1000, extras = [];
        if (currentMaterial === 'banner') { if (document.getElementById('bProkl')?.checked) extras.push({ name: 'Проклейка', cost: perim * 60 * qty }); if (document.getElementById('bLyuv')?.checked) { const lc = (Math.floor(w / 300) + Math.floor(h / 300)) * 2; extras.push({ name: `Люверсы (${lc < 4 ? 4 * qty : lc * qty} шт)`, cost: (lc < 4 ? 4 * qty : lc * qty) * 20 }); } }
        else if (currentMaterial === 'selfad') { if (document.getElementById('sRezka')?.checked) extras.push({ name: `Обрезка (${(perim*qty).toFixed(2)} м.п.)`, cost: perim * 25 * qty }); }
        let total = area * ppm * qty; extras.forEach(e => total += e.cost); total += 300; if (total < 1000) total = 1000;
        document.getElementById('mTotal').innerText = Math.round(total).toLocaleString() + ' р.';
        matData = { type: currentMaterial, width: w, height: h, qty, total: Math.round(total), totalArea, extras, material: { banner: '🪧 Баннер', selfad: '🏷️ Самоклейка', poster: '🖼️ Плакат' } [currentMaterial] };
    }

    function buildSummary() { const d = matData; return `<div class="summary-row"><span>Материал:</span><span>${d.material}</span></div><div class="summary-row"><span>Размер:</span><span>${d.width}×${d.height} мм</span></div><div class="summary-row"><span>Кол-во:</span><span>${d.qty} шт</span></div>${d.extras.map(e => `<div class="summary-row"><span>${e.name}:</span><span>${Math.round(e.cost)} р.</span></div>`).join('')}<div class="summary-row"><span>Доставка:</span><span>300 р.</span></div><div class="summary-row total"><span>Итого:</span><span>${d.total.toLocaleString()} р.</span></div>`; }
    function handleFile(e) { const f = e.target.files[0]; if (f) { document.getElementById('uploadZone').classList.add('has-file'); document.getElementById('uploadText').innerText = '✅ ' + f.name; uploadedFile = f; } }

    async function submitOrder() {
        const name = document.getElementById('custName').value.trim(), phone = document.getElementById('custPhone').value.trim(); if (!name || !phone) { alert('Заполните имя и телефон'); return; }
        const email = document.getElementById('custEmail').value.trim();
        const order = { ...matData, name, phone, email, addr: document.getElementById('custAddr').value.trim(), userId: currentUser?.id || '' };
        if (uploadedFile) { const reader = new FileReader(); const base64 = await new Promise(r => { reader.onload = () => r(reader.result.split(',')[1]); reader.readAsDataURL(uploadedFile); }); order.fileBase64 = base64; order.fileName = uploadedFile.name; }
        try { const res = await fetch(API + '/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(order) }); const data = await res.json(); if (data.success) { if (!currentUser && email) { currentUser = { email, name, phone, addr: order.addr }; localStorage.setItem('currentUser', JSON.stringify(currentUser)); } alert('✅ Заказ #' + data.id + ' оформлен!'); orderStep = 1; renderOrderStep(); switchTab('tab-home'); } } catch (e) { alert('Ошибка сервера'); }
    }

    // ========== ЧАТ ==========
    async function loadChatPage() {
        const container = document.getElementById('chatPage');
        if (!currentUser) { container.innerHTML = '<div class="card"><p style="color:var(--gray);text-align:center;">Войдите в профиль, чтобы использовать чат.</p><button class="btn btn-primary" onclick="switchTab(\'tab-profile\')">👤 Войти</button></div>'; clearInterval(window._chatInterval); return; }
        const msgsBox = document.getElementById('chatMsgs');
        const wasAtBottom = msgsBox ? (msgsBox.scrollHeight - msgsBox.scrollTop - msgsBox.clientHeight < 60) : true;
        const res = await fetch(API + '/chat/' + currentUser.id); const msgs = await res.json();
        if (msgsBox) { msgsBox.innerHTML = msgs.map(m => `<div class="chat-msg ${m.from==='admin'?'admin':'client'}">${m.text}<br><small style="opacity:0.5;">${new Date(m.time).toLocaleTimeString()}</small></div>`).join(''); if (wasAtBottom) msgsBox.scrollTop = msgsBox.scrollHeight; }
        else { container.innerHTML = `<div class="chat-box"><div class="chat-messages" id="chatMsgs">${msgs.map(m => `<div class="chat-msg ${m.from==='admin'?'admin':'client'}">${m.text}<br><small style="opacity:0.5;">${new Date(m.time).toLocaleTimeString()}</small></div>`).join('')}</div><button class="scroll-down-btn" onclick="const m=document.getElementById('chatMsgs');m.scrollTop=m.scrollHeight;this.style.display='none';">⌄</button><div class="chat-input-row"><input type="text" id="chatInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter'){event.preventDefault();sendChatPage();}"><button onclick="sendChatPage()">➤</button></div></div>`; document.getElementById('chatMsgs').scrollTop = document.getElementById('chatMsgs').scrollHeight; }
        clearInterval(window._chatInterval);
        window._chatInterval = setInterval(loadChatPage, 3000);
    }
    async function sendChatPage() { const input = document.getElementById('chatInput'); const text = input.value.trim(); if (!text || !currentUser?.id) return; input.value = ''; await fetch(API + '/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, from: currentUser.email || 'client', text }) }); loadChatPage(); }

    // ========== ПРОФИЛЬ ==========
    function loadProfile() {
        const container = document.getElementById('profileContent');
        if (!currentUser) {
            container.innerHTML = `<div id="tgWidgetContainer"></div><p style="text-align:center;margin:12px 0;color:var(--gray);">или</p><div class="card"><div class="form-group"><label>Email</label><input type="email" id="authEmail"></div><div class="form-group"><label>Пароль</label><input type="password" id="authPass"></div><div id="regFields" style="display:none;"><div class="form-group"><label>Имя</label><input type="text" id="regName"></div><div class="form-group"><label>Телефон</label><input type="tel" id="regPhone"></div></div><button class="btn btn-primary" id="authBtn" onclick="doLogin()">Войти</button><button class="btn btn-outline" onclick="toggleReg()" id="regToggle">Создать аккаунт</button><a href="#" onclick="showForgotPassword()" style="display:block;text-align:center;font-size:12px;color:var(--gray);margin-top:8px;">Забыли пароль?</a></div>`;
            const tgScript = document.createElement('script'); tgScript.async = true; tgScript.src = 'https://telegram.org/js/telegram-widget.js?22'; tgScript.setAttribute('data-telegram-login', 'Someprintbot'); tgScript.setAttribute('data-size', 'medium'); tgScript.setAttribute('data-radius', '10'); tgScript.setAttribute('data-onauth', 'onTelegramAuth(user)'); tgScript.setAttribute('data-request-access', 'write');
            document.getElementById('tgWidgetContainer').appendChild(tgScript);
        } else {
            container.innerHTML = `<div class="card"><p><strong>${currentUser.name||''}</strong></p><p style="color:var(--gray);">${currentUser.email||''}</p><p style="color:var(--gray);">${currentUser.phone||''}</p><button class="btn btn-outline" onclick="logout()">🚪 Выйти</button><button class="btn btn-outline" onclick="deleteAccount()" style="color:var(--red);border-color:var(--red);">🗑 Удалить профиль</button></div><h3 style="margin-top:16px;">📋 История заказов</h3><div id="profileOrders"></div>`;
            loadProfileOrders();
        }
    }

    function showForgotPassword() {
        document.getElementById('profileContent').innerHTML = `<div class="card" id="forgotForm"><h3>Восстановление пароля</h3><div class="form-group"><label>Email</label><input type="email" id="forgotEmail"></div><button class="btn btn-primary" onclick="sendResetCode()">Отправить код</button><button class="btn btn-outline" onclick="loadProfile()">← Назад</button></div>`;
    }

    async function sendResetCode() {
        const email = document.getElementById('forgotEmail').value.trim(); if (!email) { alert('Введите email'); return; }
        const res = await fetch(API + '/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) }); const data = await res.json();
        if (data.success) { document.getElementById('forgotForm').innerHTML = `<h3>Код отправлен</h3><p style="font-size:13px;color:var(--gray);">Проверьте почту ${email}</p><div class="form-group"><label>Код из письма</label><input type="text" id="resetCode"></div><div class="form-group"><label>Новый пароль</label><input type="password" id="newPass"></div><button class="btn btn-primary" onclick="resetPassword()">Сменить пароль</button><button class="btn btn-outline" onclick="loadProfile()">← Назад</button>`; } else alert(data.error);
    }

    async function resetPassword() {
        const email = document.getElementById('forgotEmail').value.trim(), code = document.getElementById('resetCode').value.trim(), pass = document.getElementById('newPass').value.trim(); if (!code || !pass) { alert('Заполните все поля'); return; }
        const res = await fetch(API + '/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, code, newPassword: pass}) }); const data = await res.json();
        if (data.success) { alert('Пароль изменён! Теперь войдите.'); loadProfile(); } else alert(data.error);
    }

    async function deleteAccount() { if (!confirm('Точно удалить профиль? Все данные будут потеряны.')) return; await fetch(API + '/delete-account', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId: currentUser.id}) }); logout(); }

    async function loadProfileOrders() {
        const container = document.getElementById('profileOrders'); if (!container) return;
        try { const res = await fetch(API + '/orders/' + (currentUser.id || '')); const orders = await res.json(); const sn = { 'new': 'Новый', 'processing': 'В обработке', 'printing': 'В печати', 'ready': 'Готов', 'shipped': 'Отправлен', 'done': 'Доставлен' }; container.innerHTML = orders.length === 0 ? '<p style="color:var(--gray);">Нет заказов</p>' : orders.map(o => `<div class="card"><strong>#${o.id}</strong> — ${o.material}<br>${o.width}×${o.height} мм × ${o.qty} шт — ${o.total} р.<br><span class="status-badge status-${o.status||'new'}">${sn[o.status]||'Новый'}</span></div>`).join(''); } catch (e) { container.innerHTML = '<p style="color:var(--gray);">Ошибка загрузки</p>'; }
    }

    let isReg = false;
    function toggleReg() { isReg = !isReg; document.getElementById('regFields').style.display = isReg ? 'block' : 'none'; document.getElementById('regToggle').innerText = isReg ? 'Уже есть аккаунт' : 'Создать аккаунт'; document.getElementById('authBtn').innerText = isReg ? 'Зарегистрироваться' : 'Войти'; document.getElementById('authBtn').onclick = isReg ? doRegister : doLogin; }
    async function doLogin() { const email = document.getElementById('authEmail').value.trim(), pass = document.getElementById('authPass').value.trim(); if (!email || !pass) { alert('Заполните поля'); return; } const res = await fetch(API + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass }) }); const data = await res.json(); if (data.success) { currentUser = { ...data.user, id: data.user.id || data.user._id }; localStorage.setItem('currentUser', JSON.stringify(currentUser)); loadProfile(); subscribePush(); } else alert(data.error); }
    async function doRegister() { const email = document.getElementById('authEmail').value.trim(), pass = document.getElementById('authPass').value.trim(), name = document.getElementById('regName').value.trim(), phone = document.getElementById('regPhone').value.trim(); if (!email || !pass) { alert('Заполните поля'); return; } const res = await fetch(API + '/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass, name, phone }) }); const data = await res.json(); if (data.success) { currentUser = { ...data.user, id: data.user.id || data.user._id }; localStorage.setItem('currentUser', JSON.stringify(currentUser)); loadProfile(); subscribePush(); } else alert(data.error); }
    function logout() { currentUser = null; localStorage.removeItem('currentUser'); loadProfile(); }
    function onTelegramAuth(user) { fetch(API + '/telegram-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(user) }).then(r => r.json()).then(data => { if (data.success) { currentUser = data.user; localStorage.setItem('currentUser', JSON.stringify(currentUser)); loadProfile(); subscribePush(); } }); }

    // ========== МОДАЛЬНЫЕ ОКНА (Политика, Соглашение, Макеты) ==========
async function openModal(t) {
    const urls = { policy: '/legal/privacy.html', terms: '/legal/terms.html', design: '/legal/design.html' };
    try {
        const res = await fetch(urls[t]);
        const html = await res.text();
        document.getElementById('modalContent').innerHTML = html + '<button class="btn btn-primary" onclick="closeModal()" style="margin-top:12px;">Закрыть</button>';
    } catch (e) {
        document.getElementById('modalContent').innerHTML = '<p>Ошибка загрузки</p><button class="btn btn-primary" onclick="closeModal()" style="margin-top:12px;">Закрыть</button>';
    }
    document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }
    
    renderOrderStep();
</script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }</script>
</body>
